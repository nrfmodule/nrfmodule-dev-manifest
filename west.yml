manifest:
  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect
    - name: nrfmodule
      url-base: https://github.com/nrfmodule

  projects:
    # 1. DEFINE THE OS HERE (The Boss)
    # Since this is listed first/explicitly, it overrides whatever the library says.
    - name: sdk-nrf
      remote: ncs
      path: nrf
      revision: v3.4.0
      import: true

    # 2. The Serial Modem (New Dependency)
    - name: ncs-serial-modem
      remote: nrfmodule
      path: ncs-serial-modem
      revision: v0.8.0-ncs340  # deployed serial-modem FW line; bump deliberately with FW deployments

    # 3. The Public SDK
    - name: nrfmodule-sdk
      remote: nrfmodule
      path: modules/lib/nrfmodule-sdk
      revision: main  # Latest development. Customers: use a tagged revision (e.g., v3.1.0)
      # We still import it to get its dependencies (if any),
      # but its definition of 'sdk-nrf' will be IGNORED because we defined it above.
      import: true

    # 4. The Private Source (for development, tracks SDK version)
    - name: nrfmodule-core
      remote: nrfmodule
      path: modules/lib/nrfmodule-core
      revision: main  # Latest development. Customers: use a tagged revision (e.g., v3.1.0)

    # 5. LZ4 (log upload compression). Zephyr in NCS v3.4.0 lists it as an
    # external module and no longer fetches it. Commit on its zephyr branch, bump on purpose.
    - name: lz4
      url: https://github.com/zephyrproject-rtos/lz4
      revision: 0ad20d0fc4ec70d6f4c3d399357e59d0544cf07f
      path: modules/lib/lz4

  self:
    path: config/manifest