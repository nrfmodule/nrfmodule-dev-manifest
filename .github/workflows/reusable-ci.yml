name: Shared CI Logic

on:
  workflow_call:
    inputs:
      test-path:
        required: true
        type: string
        default: "tests"

jobs:
  run-tests:
    runs-on: ubuntu-latest
    container:
      # YOUR CUSTOM IMAGE
      image: ghcr.io/nrfmodule/nrfmodule-dev-manifest:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Checkout Code (The PR Code)
        uses: actions/checkout@v4
        with:
          path: pr_code

      - name: Initialize West Workspace
        run: |
          mkdir workspace
          cd workspace

          # 1. Initialize with the platform manifest (NCS v3.2.1 + platform libs)
          west init -m https://github.com/nrfmodule/nrfmodule-dev-manifest

          # 2. Skip the private core repo: the PR checkout replaces it below
          west config manifest.project-filter -- "-nrfmodule-core"
          west update

          # 3. THE SWAP (use the code from the Pull Request)
          rm -rf modules/lib/nrfmodule-core
          mv $GITHUB_WORKSPACE/pr_code modules/lib/nrfmodule-core

      - name: Run Twister
        working-directory: workspace
        run: |
          # Let Twister decide based on testcase.yaml
          west twister \
            -T modules/lib/nrfmodule-core/${{ inputs.test-path }} \
            --integration \
            --outdir /tmp/twister-out \
            --clobber

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-report
          path: /tmp/twister-out/